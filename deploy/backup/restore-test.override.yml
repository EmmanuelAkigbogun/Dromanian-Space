# Isolates the root standalone Compose stack for a restore drill. Production
# containers, paths and ports are never referenced by this override.
services:
  mount-guard:
    volumes: !override
      - type: bind
        source: ${RESTORE_ROOT:?RESTORE_ROOT}/app
        target: /check/app
        bind:
          create_host_path: false
      - type: bind
        source: ${RESTORE_ROOT:?RESTORE_ROOT}/cloud
        target: /check/cloud
        bind:
          create_host_path: false

  db:
    volumes: !override
      - type: bind
        source: ${RESTORE_ROOT:?RESTORE_ROOT}/app/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false

  api:
    # Keep truthful readiness dependencies but do not inherit the production
    # browser-scraper dependency tree into this isolated drill.
    depends_on: !override
      rest:
        condition: service_healthy
      agno:
        condition: service_healthy
    volumes: !override
      - type: bind
        source: ${RESTORE_ROOT:?RESTORE_ROOT}/cloud/storage
        target: /data/storage
        bind:
          create_host_path: false

  worker:
    depends_on: !override
      rest:
        condition: service_healthy
      agno:
        condition: service_healthy
    volumes: !override
      - type: bind
        source: ${RESTORE_ROOT:?RESTORE_ROOT}/cloud/storage
        target: /data/storage
        bind:
          create_host_path: false

  agno:
    volumes: !override
      - type: bind
        source: ${RESTORE_ROOT:?RESTORE_ROOT}/cloud/storage
        target: /data/storage
        read_only: true
        bind:
          create_host_path: false

  livekit:
    profiles: ["media-restore-test"]
    ports: !override []

  coturn:
    profiles: ["media-restore-test"]
    ports: !override []
    volumes: !override
      - type: bind
        source: ${RESTORE_ROOT:?RESTORE_ROOT}/app/coturn
        target: /run/coturn
        read_only: true
        bind:
          create_host_path: false

  web:
    # The normal web service waits for LiveKit. The drill intentionally does
    # not start or require media services on the production host ports.
    depends_on: !override
      api:
        condition: service_healthy
    ports: !override
      - "127.0.0.1:18000:8080"

# Restored queues and credentials must never reach third-party services during
# a drill. Published loopback web access remains available for health/manual
# checks, while containers can communicate only inside this Compose project.
networks:
  default:
    internal: true
