# Isolates the root standalone Compose stack for a restore drill. Production
# containers, paths and ports are never referenced by this override.
services:
  mount-guard:
    volumes: !override
      - type: bind
        source: ${RESTORE_ROOT:?RESTORE_ROOT}/app
        target: /check/app
        bind:
          create_host_path: false
      - type: bind
        source: ${RESTORE_ROOT:?RESTORE_ROOT}/cloud
        target: /check/cloud
        bind:
          create_host_path: false

  db:
    volumes: !override
      - type: bind
        source: ${RESTORE_ROOT:?RESTORE_ROOT}/app/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false

  api:
    volumes: !override
      - type: bind
        source: ${RESTORE_ROOT:?RESTORE_ROOT}/cloud/storage
        target: /data/storage
        bind:
          create_host_path: false

  worker:
    volumes: !override
      - type: bind
        source: ${RESTORE_ROOT:?RESTORE_ROOT}/cloud/storage
        target: /data/storage
        bind:
          create_host_path: false

  coturn:
    profiles: ["turn-restore-test"]
    volumes: !override
      - type: bind
        source: ${RESTORE_ROOT:?RESTORE_ROOT}/app/coturn
        target: /run/coturn
        read_only: true
        bind:
          create_host_path: false

  web:
    ports: !override
      - "127.0.0.1:18000:8080"
