# Headers for /office/ (ONLYOFFICE Document Server). Its editor runs its own
# bundled scripts, so the application's strict Content-Security-Policy does
# not apply here; framing stays limited to this origin.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
