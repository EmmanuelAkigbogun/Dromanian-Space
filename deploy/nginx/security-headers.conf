# Included in every location: nginx does not inherit add_header into
# locations that declare their own.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "compute-pressure=*" always;
# Served only over HTTPS through the Coolify proxy.
add_header Strict-Transport-Security "max-age=31536000" always;
# Structural restrictions only; script and connection sources are not limited
# here because the app talks to the Supabase origin and loads link previews.
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
