# Included in every location: nginx does not inherit add_header into
# locations that declare their own.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), compute-pressure=()" always;
# Served only over HTTPS through the Coolify proxy.
add_header Strict-Transport-Security "max-age=31536000" always;
# Same-origin API/SSE plus explicit browser media/blob sources. Google Fonts is
# used by the workspace appearance controls. ONLYOFFICE 9.2 adds an empty
# onmousewheel handler to its iframe; unsafe-hashes plus the SHA-256 of the
# empty string permits only that harmless compatibility handler without
# enabling arbitrary inline scripts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' wss://$host; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
