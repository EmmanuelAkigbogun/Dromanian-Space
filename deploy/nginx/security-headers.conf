# Included in every location: nginx does not inherit add_header into
# locations that declare their own.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), compute-pressure=()" always;
# Served only over HTTPS through the Coolify proxy.
add_header Strict-Transport-Security "max-age=31536000" always;
# Same-origin API/SSE plus explicit browser media/blob sources.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
