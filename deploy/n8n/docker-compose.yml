# Optional n8n for external workflow automation — a third, independent
# Coolify resource. Dromanian Space works fully without it.
#
# Isolation: n8n has its own PostgreSQL (never the application database) and its
# own data directories, and talks to the app only through the signed public
# API (/api/integrations/n8n/runs). Internal scheduling stays with pg_cron and
# the app's worker; n8n never runs the app's maintenance jobs.
#
# License: n8n is under the Sustainable Use License (fair-code), not an OSI
# open-source license. Internal business use is allowed; offering n8n itself to
# customers (hosted, white-labelled or embedded for tenants) needs a commercial
# agreement with n8n. See docs/AUTOMATION.md.
#
# Coolify: Docker Compose resource from this repository, base directory
# /deploy/n8n; assign https://n8n.digitalromanian.com to the "n8n" service,
# port 5678. Never run `docker compose down -v`.

name: dromanian-n8n

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mount-guard:
    image: busybox:1.37.0
    restart: "no"
    logging: *logging
    command: ["sh", "-c", "test -f /check/.dromanian-space-mount || { echo 'Data mount missing: /srv/app-data/dromanian-space'; exit 1; }"]
    volumes:
      - type: bind
        source: /srv/app-data/dromanian-space
        target: /check
        read_only: true
        bind:
          create_host_path: false

  n8n-db:
    image: postgres:17.8-alpine
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 1m
    depends_on:
      mount-guard:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - type: bind
        source: /srv/app-data/dromanian-space/n8n/db
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.8
    restart: unless-stopped
    logging: *logging
    depends_on:
      n8n-db:
        condition: service_healthy
    expose:
      - "5678"
    # The production host terminates public traffic through Cloudflare Tunnel.
    # Keep the origin loopback-only so it cannot bypass that edge.
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:${N8N_HOST_PORT:-3010}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD}
      # Encrypts stored credentials. Back it up: without it, saved credentials are lost.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:?N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Bucharest}
      TZ: ${GENERIC_TIMEZONE:-Europe/Bucharest}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Code nodes may use crypto to sign requests to Dromanian Space.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # The signing workflow reads these at runtime; they are secrets in
      # Coolify and are never embedded in an exported workflow.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      DROMANIAN_KEY_ID: ${DROMANIAN_KEY_ID:?DROMANIAN_KEY_ID}
      DROMANIAN_KEY_SECRET: ${DROMANIAN_KEY_SECRET:?DROMANIAN_KEY_SECRET}
      DROMANIAN_BASE_URL: ${DROMANIAN_BASE_URL:-https://darkspace.purplehive.pro}
      # Execution timeouts and log retention (14 days).
      EXECUTIONS_TIMEOUT: "300"
      EXECUTIONS_TIMEOUT_MAX: "3600"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
    volumes:
      - type: bind
        source: /srv/app-data/dromanian-space/n8n/data
        target: /home/node/.n8n
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
