[project]
name = "darkspace-agno-runtime"
version = "1.0.0"
description = "Internal Agno runtime for Darkspace"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cryptography==46.0.5",
  "agno[anthropic,cerebras,google,openai]==3.1.10",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
