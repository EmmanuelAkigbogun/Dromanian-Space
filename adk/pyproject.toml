[project]
name = "darkspace-adk-runtime"
version = "1.0.0"
description = "Internal Google ADK runtime for Darkspace"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cryptography==46.0.5",
  "google-adk==2.13.0",
  "litellm[mcp]==1.106.4",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
