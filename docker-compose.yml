# Dromanian Space: one self-contained stack on the user's server.
# PostgreSQL and file bytes are persisted on the dedicated host disks. Only
# the Nginx web service publishes a loopback port; the database and its private
# REST translator are never exposed outside this Compose network.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-hardening: &app-hardening
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-server-env: &server-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}@db:5432/postgres
  DATABASE_REST_URL: http://rest:3000
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET}
  SESSION_DAYS: ${SESSION_DAYS:-30}
  DEFAULT_WORKSPACE_SLUG: ${DEFAULT_WORKSPACE_SLUG:-digital-romanian}
  DEFAULT_CHANNEL_SLUG: ${DEFAULT_CHANNEL_SLUG:-general}
  STORAGE_ROOT: /data/storage
  STORAGE_MAX_FILE_BYTES: ${STORAGE_MAX_FILE_BYTES:-52428800}
  STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:-}
  AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-openai}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_REFUSAL_FALLBACK: ${ANTHROPIC_REFUSAL_FALLBACK:-on}
  AI_DEFAULT_ANTHROPIC_MODEL: ${AI_DEFAULT_ANTHROPIC_MODEL:-claude-opus-5-5}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_API: ${GEMINI_API:-}
  CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
  CEREBRAS_DIGITALROMANIAN: ${CEREBRAS_DIGITALROMANIAN:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
  OPENAI_PROJECT_ID: ${OPENAI_PROJECT_ID:-}
  AI_DEFAULT_OPENAI_MODEL: ${AI_DEFAULT_OPENAI_MODEL:-gpt-6.1-sol}
  AI_DEFAULT_GEMINI_MODEL: ${AI_DEFAULT_GEMINI_MODEL:-gemini-3.8-flash}
  AI_DEFAULT_CEREBRAS_MODEL: ${AI_DEFAULT_CEREBRAS_MODEL:-gpt-oss-120b}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyage-3.5}
  CRON_SECRET: ${CRON_SECRET:-}
  AGENT_RUN_BUDGET_MS: ${AGENT_RUN_BUDGET_MS:-600000}
  AGNO_URL: http://agno:8000
  AGNO_TOOL_CALLBACK_URL: http://worker:3001/tool
  AGNO_TOOL_PORT: "3001"
  CRAWL4AI_URL: http://crawl4ai-gateway:8080
  CRAWL4AI_API_TOKEN_FILE: /run/browser-scraper/api_token
  # Increment together with any APP_JWT_SECRET rotation. It is also present on
  # Crawl4AI so Compose recreates every token consumer in the same rollout.
  CRAWL4AI_TOKEN_EPOCH: ${CRAWL4AI_TOKEN_EPOCH:-1}
  N8N_BASE_URL: ${N8N_BASE_URL:-}
  SOCIAL_BROWSER_WS_ENDPOINT: ${SOCIAL_BROWSER_WS_ENDPOINT:-}
  SOCIAL_BROWSER_TOKEN: ${SOCIAL_BROWSER_TOKEN:-}
  TURN_HOST: ${TURN_HOST:-turn.purplehive.pro}
  TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-wss://darkspace.purplehive.pro}
  CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
  CLOUDFLARE_TURN_KEY_API_TOKEN: ${CLOUDFLARE_TURN_KEY_API_TOKEN:-}
  WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
  WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
  WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
  ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
  ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL:-http://onlyoffice}
  APP_INTERNAL_URL: ${APP_INTERNAL_URL:-http://api:3000}
  NODE_OPTIONS: --max-old-space-size=384

services:
  mount-guard:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    restart: "no"
    logging: *logging
    command:
      - sh
      - -c
      - |
        for d in /check/app /check/cloud; do
          test -f "$$d/.dromanian-space-mount" || { echo "Required data mount missing: $$d"; exit 1; }
        done
        mkdir -p /check/app/postgres /check/cloud/storage
    volumes:
      - /srv/app-data/dromanian-space:/check/app
      - /srv/cloud-data/dromanian-space:/check/cloud

  # Generate a purpose-specific random token without sharing APP_JWT_SECRET
  # with any helper or third-party container. App services and Crawl4AI mount
  # only this token, read-only.
  browser-scraper-token:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    restart: "no"
    logging: *logging
    environment:
      CRAWL4AI_TOKEN_EPOCH: ${CRAWL4AI_TOKEN_EPOCH:-1}
    command:
      - sh
      - -ec
      - |
        umask 033
        epoch="$${CRAWL4AI_TOKEN_EPOCH:-1}"
        case "$$epoch" in
          ''|*[!A-Za-z0-9._-]*|?????????????????????????????????????????????????????????????????*)
            echo "Invalid CRAWL4AI_TOKEN_EPOCH" >&2
            exit 1
            ;;
        esac
        current_epoch="$$(cat /run/browser-scraper/token_epoch 2>/dev/null || true)"
        if [ ! -s /run/browser-scraper/api_token ] || [ "$$current_epoch" != "$$epoch" ]; then
          head -c 32 /dev/urandom | sha256sum | cut -c 1-64 > /run/browser-scraper/.api_token.tmp
          printf '%s\n' "$$epoch" > /run/browser-scraper/.token_epoch.tmp
          chmod 0444 /run/browser-scraper/.api_token.tmp /run/browser-scraper/.token_epoch.tmp
          mv /run/browser-scraper/.api_token.tmp /run/browser-scraper/api_token
          mv /run/browser-scraper/.token_epoch.tmp /run/browser-scraper/token_epoch
        fi
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - browser-scraper-token:/run/browser-scraper

  # Browser-rendered extraction from Crawl4AI. This service has no host port,
  # accepts only authenticated requests, and keeps dangerous request features
  # (arbitrary JS, cookies, proxies and deep crawling) disabled.
  crawl4ai:
    image: unclecode/crawl4ai:0.9.5@sha256:0b05666882bfb67f45d559a5b827839c54127b74aedd723f8ab338a3571b5fc9
    restart: unless-stopped
    logging: *logging
    depends_on:
      browser-scraper-token:
        condition: service_completed_successfully
    environment:
      CRAWL4AI_ALLOW_DEEP_CRAWL: "false"
      CRAWL4AI_TOKEN_EPOCH: ${CRAWL4AI_TOKEN_EPOCH:-1}
    expose:
      - "11235"
    shm_size: "1gb"
    user: appuser
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/redis:uid=999,gid=999,mode=0700
      - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
      - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - browser-scraper-token:/run/secrets:ro
    networks:
      - browser-egress
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 4G
          pids: 512
        reservations:
          memory: 1G
    healthcheck:
      # `/health` is intentionally public; authenticated `/schema` verifies
      # that the mounted token and protected API boundary agree.
      test: ["CMD-SHELL", "TOKEN=$$(cat /run/secrets/api_token) && curl -fsS -H \"Authorization: Bearer $$TOKEN\" http://127.0.0.1:11235/schema >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # The app never joins Crawl4AI's network. This fixed-upstream gateway is the
  # only bridge: it exposes only authenticated schema and Markdown requests,
  # and cannot be turned into a caller-selected forward proxy.
  crawl4ai-gateway:
    image: ghcr.io/nginx/nginx-unprivileged:1.30.5-alpine@sha256:56b8272e43a0525f67aed68d1e0794a712d10e3e45a563e118e9a77c817e6f86
    restart: unless-stopped
    logging: *logging
    depends_on:
      crawl4ai:
        condition: service_healthy
    entrypoint: ["/usr/sbin/nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ./deploy/nginx/crawl4ai-gateway.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    networks:
      - default
      - browser-egress
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  db:
    image: pgvector/pgvector:0.8.1-pg17-bookworm@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 2m
    depends_on:
      mount-guard:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - type: bind
        source: /srv/app-data/dromanian-space/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G

  migrate:
    build:
      context: .
      target: migrations
    restart: "no"
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      DATABASE_API_PASSWORD: ${DATABASE_API_PASSWORD:?DATABASE_API_PASSWORD}

  rest:
    image: postgrest/postgrest:v14.17@sha256:c9dc201e555f5d8e37e7f39cdd4df0229774996e213bfd7de8d10ac609030f2c
    restart: unless-stopped
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgresql://authenticator:${DATABASE_API_PASSWORD:?DATABASE_API_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET}
      PGRST_DB_POOL: ${DATABASE_REST_POOL_SIZE:-10}
      PGRST_DB_MAX_ROWS: ${DATABASE_MAX_ROWS:-1000}
      PGRST_SERVER_PORT: "3000"
      PGRST_ADMIN_SERVER_PORT: "3001"
    expose:
      - "3000"
    healthcheck:
      # The distroless image has no shell or HTTP client, and `--ready` refuses
      # the all-interfaces server host. Parsing the live config still catches
      # invalid database/JWT settings; the API readiness probe verifies queries.
      test: ["CMD", "postgrest", "--dump-config"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *app-hardening
    build:
      context: .
      target: server
    command: ["node", "--enable-source-maps", "dist-server/main.mjs"]
    environment:
      <<: *server-env
      PORT: "3000"
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-600}
      API_AGENT_RATE_LIMIT_PER_MINUTE: ${API_AGENT_RATE_LIMIT_PER_MINUTE:-30}
      # Optional Domains fallback. Keep these API-only: the worker never
      # manages DNS and must not receive the scoped Cloudflare token.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID:-}
      CLOUDFLARE_TUNNEL_SERVICE: ${CLOUDFLARE_TUNNEL_SERVICE:-http://web:8080}
    expose:
      - "3000"
    depends_on:
      rest:
        condition: service_healthy
      browser-scraper-token:
        condition: service_completed_successfully
      crawl4ai-gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: /srv/cloud-data/dromanian-space/storage
        target: /data/storage
        bind:
          create_host_path: false
      - browser-scraper-token:/run/browser-scraper:ro
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  agno:
    <<: *app-hardening
    build:
      context: .
      target: agno
    environment:
      PORT: "8000"
      HOME: /tmp
      AGNO_TELEMETRY: "false"
      AGNO_INTERNAL_TOKEN: ${APP_JWT_SECRET:?APP_JWT_SECRET}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET}
      STORAGE_ROOT: /data/storage
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
      OPENAI_PROJECT_ID: ${OPENAI_PROJECT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API: ${GEMINI_API:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_DIGITALROMANIAN: ${CEREBRAS_DIGITALROMANIAN:-}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: /srv/cloud-data/dromanian-space/storage
        target: /data/storage
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app-hardening
    build:
      context: .
      target: server
    command: ["node", "--enable-source-maps", "dist-server/worker-main.mjs"]
    environment:
      <<: *server-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      NODE_OPTIONS: --max-old-space-size=768
    depends_on:
      rest:
        condition: service_healthy
      agno:
        condition: service_healthy
      browser-scraper-token:
        condition: service_completed_successfully
      crawl4ai-gateway:
        condition: service_healthy
    expose:
      - "3001"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: /srv/cloud-data/dromanian-space/storage
        target: /data/storage
        bind:
          create_host_path: false
      - browser-scraper-token:/run/browser-scraper:ro
    networks:
      - default
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "const t=+require('fs').readFileSync('/tmp/worker-alive','utf8');process.exit(Date.now()-t<120000?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  livekit:
    image: livekit/livekit-server:v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
    restart: unless-stopped
    logging: *logging
    command: ["--disable-strict-config"]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
          turn_servers:
            - host: ${TURN_HOST:-turn.purplehive.pro}
              port: 3478
              protocol: udp
              secret: '${TURN_SHARED_SECRET:?TURN_SHARED_SECRET}'
            - host: ${TURN_HOST:-turn.purplehive.pro}
              port: 5349
              protocol: tls
              secret: '${TURN_SHARED_SECRET:?TURN_SHARED_SECRET}'
        room:
          empty_timeout: 300
          departure_timeout: 20
        keys:
          '${LIVEKIT_API_KEY:?LIVEKIT_API_KEY}': '${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET}'
    expose:
      - "7880"
    ports:
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G
    stop_grace_period: 5m

  # Word/Excel/PowerPoint editing for Drive. Reached by browsers through the
  # web container at /office/ and by the API on the private network. Every
  # request is signed with ONLYOFFICE_JWT_SECRET; it stores no files itself.
  onlyoffice:
    image: onlyoffice/documentserver:9.2.1@sha256:fd38f611f1127190be306fa1eb09d5f4ff7d1d2509aef3dd14aa56377915829d
    restart: unless-stopped
    logging: *logging
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      # Documents are fetched from the API on the private Docker network.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      WOPI_ENABLED: "false"
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  coturn:
    image: coturn/coturn:4.18.0-r0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    command:
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?TURN_SHARED_SECRET}
      - --realm=${TURN_HOST:-turn.purplehive.pro}
      - --server-name=${TURN_HOST:-turn.purplehive.pro}
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP}
      - --cert=/run/coturn/fullchain.pem
      - --pkey=/run/coturn/privkey.pem
      - --stale-nonce=600
      - --no-multicast-peers
      - --pidfile=/tmp/turnserver.pid
      - --no-software-attribute
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/tcp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - type: bind
        source: /srv/app-data/dromanian-space/coturn
        target: /run/coturn
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  web:
    <<: *app-hardening
    build:
      context: .
      target: web
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Dromanian Space}
        VITE_APP_URL: ${VITE_APP_URL:-}
    environment:
      API_UPSTREAM: api:3000
      LIVEKIT_UPSTREAM: livekit:7880
      ONLYOFFICE_UPSTREAM: onlyoffice:80
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3008}:8080"
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_started
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  browser-scraper-token:

networks:
  browser-egress:
    driver: bridge
